name = "danhgia"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Giữ nguyên các biến (APPS_SCRIPT_URL, PROXY_KEY) đã đặt trên dashboard mỗi lần deploy
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api"]

# Không có lịch riêng: gói Cloudflare miễn phí chỉ cho 5 lịch (Cron) cho cả tài khoản.
# Worker "tccb" sẽ đánh thức Apps Script của Worker này. Dòng dưới xóa lịch cũ (nếu có).
[triggers]
crons = []
