# Tên phải TRÙNG với tên Worker bạn đã tạo trên Cloudflare, nếu không bản build sẽ báo lỗi.
name = "ktthu"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Giữ nguyên các biến đã đặt trên dashboard mỗi lần deploy
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api"]

# Giữ Apps Script luôn "ấm": cứ 5 phút gọi nhẹ 1 lần, 7h00–18h59 giờ Việt Nam (0h–11h UTC)
[triggers]
crons = ["*/5 0-11 * * *"]
